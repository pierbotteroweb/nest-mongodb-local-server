version: '3.9'

services:
  nest-mongodb-local-server:
    image: node:20.19.5

    container_name: nest-mongodb-server

    working_dir: /app

    command: sh -c "npm install && npm run start:dev"

    ports:
      - "3000:3000"
    
    volumes:
      # projeto interno
      - G:/ShuffleTV/nest-mongodb-local-server:/app
    
    restart: always